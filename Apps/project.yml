name: NAV830
options:
  bundleIdPrefix: com.jeff.navbar00830
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  NAV830:
    path: ..

settings:
  base:
    # Automatic signing. The simulator needs no team; a real device needs the team below plus an
    # "Apple Development" certificate (Xcode creates it after signing in under Settings → Accounts).
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5M7B43XSN6
    # Version lives here so the app and its embedded widget cannot drift apart — an extension whose
    # CFBundleVersion differs from its parent app is a build warning and an App Store rejection.
    # Independent of the macOS shell's version in scripts/publish.sh (separate bundle, separate
    # install). Bump CURRENT_PROJECT_VERSION monotonically: iOS refuses to install a lower build
    # over a higher one.
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"

targets:
  NAV830iOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
    dependencies:
      - package: NAV830
        product: NAV830Core
      - package: NAV830
        product: NAV830Fetch
      - package: NAV830
        product: NAV830UI
      - target: NAV830Widget       # embed the widget extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeff.navbar00830.ios
        # iOS/Assets.xcassets/AppIcon.appiconset is regenerated by:
        #   swift scripts/make-icon.swift <out.png> --ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: NAV830 費半
        # The bundle ships for iPad too (device family defaults to iPhone+iPad), and iPad apps must
        # either declare all four orientations or opt out of multitasking. The view is a single
        # scrolling column, so supporting all four is the honest answer rather than forcing
        # full-screen.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

  NAV830Widget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    dependencies:
      - package: NAV830
        product: NAV830Core
      - package: NAV830
        product: NAV830Fetch
      - package: NAV830
        product: NAV830UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeff.navbar00830.ios.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 00830 折溢價
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
